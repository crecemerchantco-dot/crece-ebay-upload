services:
  - type: web
    name: crece-ebay-uploader
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: RENDER
        value: 'true'
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: EBAY_CLIENT_ID
        sync: false
      - key: EBAY_CLIENT_SECRET
        sync: false
      - key: EBAY_RUNAME
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
